<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Intern Seeker Dashboard - UdyamTank</title>
  <link rel="stylesheet" href="../assets/css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="has-nav">
  <!-- Navigation -->
  <nav class="navigation">
    <div class="nav-container">
      <div class="nav-content">
        <a href="../index.html" class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
            <polyline points="16 7 22 7 22 13"></polyline>
          </svg>
          <span class="logo-text">UdyamTank</span>
        </a>

        <div class="nav-actions">
          <a href="./dashboard.html" class="nav-link">Dashboard</a>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <section class="dashboard-wrapper">
    <div class="dashboard-card">
      <div class="dash-top">
        <div>
          <h2 class="dash-title">Intern Seeker Home</h2>
          <p id="status" class="dash-sub">Loading...</p>
        </div>
        <button id="logout" class="btn logout-btn">Logout</button>
      </div>

      <div class="profile-box">
        <img id="avatar" alt="avatar" style="display:none;" />
        <div class="profile-meta">
          <div id="name" class="name">—</div>
          <div id="email" class="email">—</div>
          <div id="role" class="provider">—</div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="dash-panel">
          <h3>Intern seeker tools</h3>
          <p>Find internships, build your profile, and track applications.</p>
          <div class="actions">
            <a class="action" href="#">Search Internships</a>
            <a class="action" href="#">My Applications</a>
            <a class="action" href="#">My Profile</a>
          </div>
        </div>

        <div class="dash-panel">
          <h3>Quick info</h3>
          <div class="info">
            <div class="info-row"><span>Role</span><b>INTERN_SEEKER</b></div>
            <div class="info-row"><span>Status</span><b>Active</b></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/role-dashboard.js"></script>
</body>
</html>
